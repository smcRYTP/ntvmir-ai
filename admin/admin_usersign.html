<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>НТВ Мир - административная часть</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, Arial, sans-serif; font-size: 13px; background-color: #fff; color: #333; margin: 10px; }
        .top-panel { background: #009933; color: #fff; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; letter-spacing: 0.5px; border: 1px solid #006622; margin-bottom: 20px; }
        .login-table { border-collapse: collapse; width: 350px; border: 1px solid #888; }
        .login-table th { background: #009933; color: #fff; padding: 3px; text-align: center; font-weight: bold; border-bottom: 1px solid #888; font-size: 12px; }
        .login-table td { border: 1px solid #888; padding: 3px 5px; background: #b5cfa3; }
        .label-cell { width: 80px; text-align: left; font-size: 12px; background: #b5cfa3; }
        .login-table input[type="text"], .login-table input[type="password"] { width: 100%; border: 1px solid #777; padding: 2px; font-family: Tahoma, Arial, sans-serif; font-size: 12px; outline: none; }
        .button-cell { text-align: center; background: #b5cfa3; padding: 5px; }
        .login-table button { background-color: #f8f8f8; border: 1px solid #999; border-radius: 4px; padding: 3px 12px; font-family: Tahoma, Arial, sans-serif; font-size: 12px; color: #333; cursor: default; }
        .login-table button:active { background-color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="top-panel">НТВ Мир - административная часть</div>
    <form onsubmit="checkLogin(event)">
        <table class="login-table">
            <tr><th colspan="2">Авторизация</th></tr>
            <tr><td class="label-cell">Login:</td><td><input type="text" id="loginInput"></td></tr>
            <tr><td class="label-cell">Пароль:</td><td><input type="password" id="passInput"></td></tr>
            <tr><td colspan="2" class="button-cell"><button type="submit">Войти в систему</button></td></tr>
        </table>
    </form>
    <script>
        function checkLogin(event) {
            event.preventDefault(); 
            var login = document.getElementById('loginInput').value;
            var pass = document.getElementById('passInput').value;
            if (login === 'vistauser' && pass === 'ntvmir2002') {
                // Просто открываем admin.html (он лежит в этой же папке)
                window.location.href = 'admin.html'; 
            } else {
                alert('Неверный логин или пароль!');
            }
        }
    </script>
</body>
</html>
